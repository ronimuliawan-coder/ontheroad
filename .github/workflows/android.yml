name: Android CI

# The Android build workflow executes JVM unit tests and lint checks on PRs and pushes.
# It skips documentation and instruction changes to conserve runner minutes.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '.agents/**'
      - '.claude/PRPs/**'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '.agents/**'
      - '.claude/PRPs/**'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
