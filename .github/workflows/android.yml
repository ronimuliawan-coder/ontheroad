name: Android CI

# Android CI runs JVM tests and lint; Unit 3 adds one isolated device-profile acceptance job.
# It skips documentation and instruction changes to conserve runner minutes.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '.agents/**'
      - '.claude/PRPs/**'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '.agents/**'
      - '.claude/PRPs/**'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM Unit Tests
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-ontheroad-gradle
      - nscloud-cache-allow-commit-from-main
      - nscloud-runner-tool-cache-20gb
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Namespace Gradle cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: gradle

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --parallel --build-cache

  lint:
    name: Android Lint
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-ontheroad-gradle
      - nscloud-cache-allow-commit-from-main
      - nscloud-runner-tool-cache-20gb
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Namespace Gradle cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --parallel --build-cache

  instrumentation:
    name: Android UI Acceptance (Pixel 7 Pro / API 35)
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-ontheroad-gradle
      - nscloud-cache-allow-commit-from-main
      - nscloud-runner-tool-cache-20gb
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Namespace Gradle cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: gradle

      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::warning::/dev/kvm is unavailable on this Namespace runner; the emulator will use its available fallback."
          fi

      - name: Run Android UI acceptance tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --parallel --build-cache
