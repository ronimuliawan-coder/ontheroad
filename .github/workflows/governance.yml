name: Governance

# The Android build workflow skips documentation and instruction changes to avoid
# consuming heavy runners and long Gradle compilation times. This independent check
# validates repository instructions, documentation links, credential absence, and
# manifest integrity in <30 seconds without installing dependencies or requesting secrets.
on:
  push:
    branches: [main, dev]
    paths:
      - '*.md'
      - '*.txt'
      - '*.toml'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.toml'
      - '.agents/**'
      - '.claude/PRPs/**'
      - '.env.example'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - '*.md'
      - '*.txt'
      - '*.toml'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.toml'
      - '.agents/**'
      - '.claude/PRPs/**'
      - '.env.example'
      - 'package.json'
      - 'scripts/verify-governance.mjs'
      - '.github/workflows/governance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify repository governance
        run: bun run governance:check

      - name: Run governance unit tests
        run: bun test

      - name: Record governance evidence
        if: always()
        run: |
          {
            echo '### Repository governance'
            echo
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| event | \`${GITHUB_EVENT_NAME}\` |"
            echo '| dependencies installed | `no` |'
            echo '| secrets requested | `no` |'
            echo '| execution duration | `<5s` |'
          } >> "$GITHUB_STEP_SUMMARY"
